<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Menu Item</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #172033;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0;
            font-size: 30px;
        }

        .title p {
            margin: 7px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .back-btn {
            text-decoration: none;
            background: #111827;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .card {
            background: white;
            border: 1px solid #e1e5eb;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17,24,39,0.08);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .price-box {
            position: relative;
        }

        .price-symbol {
            position: absolute;
            left: 14px;
            top: 13px;
            font-weight: 700;
            color: #6b7280;
        }

        .price-input {
            padding-left: 35px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            border: none;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .save-btn {
            background: #111827;
            color: white;
        }

        .save-btn:hover {
            background: #1f2937;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
        }

        .item-title {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .item-title small {
            display: block;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .item-title strong {
            font-size: 18px;
        }

        @media (max-width: 650px) {

            .container {
                margin: 20px auto;
                padding: 0 14px;
            }

            .top-bar {
                align-items: flex-start;
                gap: 15px;
            }

            .title h1 {
                font-size: 25px;
            }

            .back-btn {
                padding: 9px 12px;
                white-space: nowrap;
            }

            .card {
                padding: 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">

        <div class="title">
            <h1>Edit Menu Item</h1>
            <p>Update menu item information and price.</p>
        </div>

        <a href="/admin/menu" class="back-btn">
            ← Back
        </a>

    </div>


    <div class="card">

        <div class="item-title">
            <small>Currently editing</small>
            <strong>{{ item.name }}</strong>
        </div>


        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Item Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ item.name }}"
                    required
                >

            </div>


            <div class="row">

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ item.category or '' }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <div class="price-box">

                        <span class="price-symbol">
                            ₹
                        </span>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            value="{{ item.price }}"
                            step="0.01"
                            min="0"
                            class="price-input"
                            required
                        >

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter item description..."
                >{{ item.description or '' }}</textarea>

            </div>


            <div class="buttons">

                <a
                    href="/admin/menu"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
