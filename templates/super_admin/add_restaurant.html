<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Restaurant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 21px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .title p {
            color: #6b7280;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #111827;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .button-area {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            padding: 13px 24px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        @media (max-width: 650px) {
            .header {
                padding: 15px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }

            .button-area button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h2>Cafe QR System</h2>
    <a href="/super-admin/dashboard" class="back">← Dashboard</a>
</header>

<main class="container">

    <div class="title">
        <h1>Add New Restaurant</h1>
        <p>Create a restaurant and its admin account.</p>
    </div>

    <div class="card">

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <h2 class="section-title">Restaurant Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Restaurant Name *</label>
                    <input
                        type="text"
                        name="restaurant_name"
                        placeholder="Enter restaurant name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Owner / Admin Name *</label>
                    <input
                        type="text"
                        name="owner_name"
                        placeholder="Enter owner name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number"
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email"
                    >
                </div>

                <div class="form-group full">
                    <label>Address</label>
                    <textarea
                        name="address"
                        placeholder="Enter restaurant address"
                    ></textarea>
                </div>

                <div class="form-group full">
                    <label>GST Number</label>
                    <input
                        type="text"
                        name="gst_number"
                        placeholder="Enter GST number"
                    >
                </div>

            </div>


            <h2 class="section-title" style="margin-top:30px;">
                Restaurant Admin Login
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Admin Username *</label>
                    <input
                        type="text"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Admin Password *</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                    >
                </div>

            </div>

            <div class="button-area">
                <button type="submit">
                    Create Restaurant
                </button>
            </div>

        </form>

    </div>

</main>

</body>
</html>
