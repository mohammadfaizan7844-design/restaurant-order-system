<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f7fb;
            margin:0;
        }

        .container{
            max-width:500px;
            margin:50px auto;
            padding:20px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
            border:1px solid #eee;
        }

        h1{
            margin-top:0;
            color:#111827;
        }

        p{
            color:#6b7280;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#374151;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:18px;
            border:1px solid #ddd;
            border-radius:10px;
            box-sizing:border-box;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#111827;
        }

        button{
            width:100%;
            padding:14px;
            background:#111827;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1f2937;
        }

        .error{
            background:#fee2e2;
            color:#dc2626;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
        }

        .success{
            background:#dcfce7;
            color:#15803d;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            color:#111827;
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>🔐 Change Password</h1>

        <p>Update your admin account password.</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="success">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Current Password</label>

            <input
                type="password"
                name="current_password"
                required
            >

            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                required
            >

            <label>Confirm New Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

        <a
            class="back"
            href="/admin/settings"
        >
            ← Back to Settings
        </a>

    </div>

</div>

</body>
</html>
